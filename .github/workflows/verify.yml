name: Verify desktop packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: Linux
          - runner: windows-2025
            target: Windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - if: runner.os == 'Linux'
        name: Test and build under Xvfb
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth tk
          python -m pip install --no-deps -r packaging/requirements-build.txt
          xvfb-run -a -s '-screen 0 1600x1080x24' python tools/build_archives.py
      - if: runner.os == 'Windows'
        name: Test and build on Windows
        shell: pwsh
        run: |
          python -m pip install --no-deps -r packaging/requirements-build.txt -r packaging/requirements-build-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_archives.py
